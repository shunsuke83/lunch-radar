name: Collect lunch spots from Slack

on:
  schedule:
    - cron: "30 2 * * *" # 11:30 Asia/Seoul
  workflow_dispatch:
    inputs:
      force:
        description: "Run the agent even when there are no new Slack messages"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-lunch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUNCH_SPOTS_CHANNEL_ID: ${{ secrets.LUNCH_SPOTS_CHANNEL_ID }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for new Slack messages
        id: precheck
        env:
          SLACK_TOKEN: ${{ secrets.LUNCH_SPOTS_SLACK_USER_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$LUNCH_SPOTS_CHANNEL_ID" ]; then
            echo "::error::Secret LUNCH_SPOTS_CHANNEL_ID is not set."
            exit 1
          fi
          last=$(jq -r '.lastMessageTs // ""' web/data/restaurants.json)
          resp=$(curl -fsS -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=$LUNCH_SPOTS_CHANNEL_ID&limit=50")
          if [ "$(echo "$resp" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack conversations.history failed: $(echo "$resp" | jq -r '.error')"
            exit 1
          fi
          latest=$(echo "$resp" | jq -r '[.messages[] | select(.subtype == null) | .ts] | max // ""')
          echo "last=$last latest=$latest"
          if [ "$FORCE" = "true" ] || [ -z "$last" ] || [[ "$latest" > "$last" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new messages since $last; skipping collection."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.precheck.outputs.run == 'true' || env.KAKAO_REST_API_KEY != '' || env.GOOGLE_PLACES_API_KEY != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lunch-spots/package-lock.json

      - run: npm ci
        if: steps.precheck.outputs.run == 'true' || env.KAKAO_REST_API_KEY != '' || env.GOOGLE_PLACES_API_KEY != ''
        working-directory: lunch-spots

      - name: Collect channel history and export catalog
        if: steps.precheck.outputs.run == 'true'
        working-directory: lunch-spots
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          LUNCH_SPOTS_SLACK_USER_TOKEN: ${{ secrets.LUNCH_SPOTS_SLACK_USER_TOKEN }}
        # The trajectory echoes tool arguments (Slack user ids); log only the reply.
        run: |
          out="$RUNNER_TEMP/agent-run.out"
          status=0
          npx @grok/agent-sdk run --dir . \
            --state-root "$RUNNER_TEMP/agent-state" \
            --no-trace --no-stream --json --timeout-ms 1200000 \
            --message "$(cat ci/collect-prompt.md)" > "$out" 2> "$RUNNER_TEMP/agent-run.err" || status=$?
          # stdout carries a few log lines before the JSON document.
          result=$(sed -n '/^{/,$p' "$out")
          echo "$result" | jq -r '"ok=\(.ok) tools=\(.trajectory.toolCallCount // 0) failedTurns=\(.trajectory.turnsFailed // 0)", "reply: \(.trajectory.finalText // .error.message // "")"' \
            || echo "::error::agent-sdk run printed no JSON result"
          if [ "$status" -ne 0 ] || [ "$(echo "$result" | jq -r '.ok' 2>/dev/null)" != "true" ]; then
            echo "::error::agent-sdk run failed (exit $status)."
            exit 1
          fi
          # export-restaurants leaves the catalog untouched while history has
          # gaps; fail so the next run's retry is visible.
          if echo "$result" | jq -r '.trajectory.finalText // ""' | grep -q 'EXPORT_INCOMPLETE'; then
            echo "::error::Collection did not reach the end of the Slack history; catalog not updated."
            exit 1
          fi

      # Runs even without new Slack messages: new places get coordinates and
      # ratings older than a week are refreshed.
      - name: Add map coordinates and web ratings
        if: env.KAKAO_REST_API_KEY != '' || env.GOOGLE_PLACES_API_KEY != ''
        working-directory: lunch-spots
        continue-on-error: true
        run: npm run -s catalog:enrich

      - name: Check exported catalog
        id: diff
        run: |
          file=web/data/restaurants.json
          count=$(jq '.restaurants | length' "$file")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::error::Export has no restaurants; keeping the committed catalog."
            exit 1
          fi
          if [ -z "$(jq -r '.lastMessageTs // ""' "$file")" ]; then
            echo "::error::Export has no lastMessageTs (history incomplete); keeping the committed catalog."
            exit 1
          fi
          normalize='{lastMessageTs, office, restaurants: (.restaurants | map(del(.addedAt, .updatedAt)) | sort_by(.slug))}'
          if diff <(git show "HEAD:$file" | jq -S "$normalize") <(jq -S "$normalize" "$file") > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- "$file"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit catalog
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/restaurants.json
          git commit -m "Update lunch catalog (${{ steps.diff.outputs.count }} spots)"
          git push

      - name: Deploy Pages
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
